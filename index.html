<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Finder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo-container" id="home-btn">
      <i class="fa-solid fa-house logo-icon"></i>
      <span class="logo-text">MEAL FINDER</span>
    </div>
    <button class="menu-toggle" id="open-sidebar" aria-label="Open Navigation Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <!-- Side Navigation Drawer -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="close-sidebar" id="close-sidebar" aria-label="Close Navigation Menu">&times;</button>
    </div>
    <ul class="sidebar-menu" id="sidebar-categories">
      <!-- Populated dynamically via JS -->
    </ul>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search recipes here ..">
        <button id="search-btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <h1>What are your favorite cuisines?</h1>
      <p>PERSONALIZE YOUR EXPERIENCE</p>
    </div>
  </section>

  <!-- Main Content Container -->
  <main class="main-container">
    
    <!-- Dynamic Content Area (Filter Results / Search Results / Meal Details) -->
    <div id="dynamic-content"></div>

    <!-- Main Categories Section -->
    <section class="categories-section" id="categories-section">
      <h2 class="section-title">CATEGORIES</h2>
      <div class="category-grid" id="category-grid">
        <!-- Populated dynamically via JS -->
      </div>
    </section>

  </main>

  <!-- Main Modular JS Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
